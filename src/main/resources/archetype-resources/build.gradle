#if(!$pluginType || $pluginType.trim() == "")##
#set($pluginType = "rest")##
#end
#set($pt = $pluginType.trim().toLowerCase())##
// Generated by elasticsearch-plugin-archetype 7.10.2
// Elasticsearch ${elasticsearchVersion} plugin, pluginType=${pluginType}
//
// Official Elasticsearch Gradle tooling (org.elasticsearch.gradle:build-tools):
//   elasticsearch.esplugin        -> generates plugin-descriptor.properties,
//                                   bundlePlugin zip and the run task
//   elasticsearch.testclusters    -> boots a real ES cluster for integration tests
//   elasticsearch.java-rest-test  -> applies testclusters, creates the
//                                   javaRestTest source set and task
buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        // build-tools 7.10.2 has legacy transitive dependencies (shadow 6.0.0,
        // nebula-core 3.0.0, gradle-docker-compose-plugin 0.12.1) that used to
        // live on JCenter. Any reachable JCenter mirror works here.
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
    dependencies {
        classpath 'org.elasticsearch.gradle:build-tools:${elasticsearchVersion}'
    }
}

apply plugin: 'elasticsearch.esplugin'
apply plugin: 'elasticsearch.testclusters'
apply plugin: 'elasticsearch.java-rest-test'

group = '${groupId}'
version = '${version}'
description = 'Elasticsearch ${elasticsearchVersion} ${pluginType} plugin'

repositories {
    mavenCentral()
}

dependencies {
    // ESRestTestCase (LuceneTestCase) needs log4j-core at runtime. In a
    // standalone project the ES test framework does not put log4j-core on the
    // javaRestTest runtime classpath, so javaRestTest fails to initialize.
    javaRestTestImplementation 'org.apache.logging.log4j:log4j-core:2.11.1'
}

esplugin {
    name '${artifactId}'
    description '${pluginName} Plugin for Elasticsearch ${elasticsearchVersion}'
    classname '${package}.${pluginName}Plugin'
    // BuildPlugin requires both files; they are bundled into the plugin zip.
    licenseFile file('LICENSE.txt')
    noticeFile file('NOTICE.txt')
}

// java-rest-test creates a cluster named "javaRestTest" and installs the
// bundlePlugin zip into it automatically (RestTestUtil.registerTask).
testClusters.all {
    testDistribution = 'DEFAULT'
    // Do not set numberOfNodes = 1: the cluster already has one node and
    // TestClustersPlugin refuses to "shrink" it to 1.
}

// The Maven descriptor template is not part of the Gradle plugin zip;
// esplugin generates its own plugin-descriptor.properties.
tasks.named('bundlePlugin') {
    exclude '**/*.tmpl'
}
